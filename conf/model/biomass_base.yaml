defaults:
  - pipeline/default@_here_
  - _self_

x_sys:
  steps:
    - _target_: src.modules.transformation.image_loader.ImageLoader
      size: 224
      mean: [0.485, 0.456, 0.406]  # ImageNet defaults
      std: [0.229, 0.224, 0.225]
      compute_stats: false

y_sys:
  steps: []

train_sys:
  steps:
    - _target_: src.modules.training.main_trainer.MainTrainer
      model_name: "BiomassEfficientNetB0"
      n_folds: 0  # 0 for train full
      epochs: 50
      patience: 15
      batch_size: 16
      gradient_accumulation_steps: 1
      use_mixed_precision: true
      nominal_batch_size: 16
      tta: true
      
      model:
        _target_: src.modules.training.models.biomass_model.BiomassModel
        backbone:
          _target_: timm.create_model
          model_name: efficientnet_b0
          pretrained: true
          num_classes: 0  # Remove classifier head
          global_pool: avg
        num_outputs: 5
        dropout: 0.3
      
      criterion:
        _target_: src.modules.training.losses.WeightedLoss
        base_loss:
          _target_: torch.nn.HuberLoss
          delta: 1.0  # Transition point in std units (1.0 = quadratic within ±1σ)
          reduction: mean
        weights: [0.1, 0.1, 0.1, 0.2, 0.5]  # [Dry_Clover_g, Dry_Dead_g, Dry_Green_g, GDM_g, Dry_Total_g]
        scale_by_variance: true  # Scale by 1/std² to align gradient descent with R² optimization
        variance_momentum: 0.1  # EWMA momentum (0.1 = 10% new batch, 90% history)
      
      optimizer:
        _target_: functools.partial
        _args_:
          - _target_: hydra.utils.get_class
            path: torch.optim.AdamW
        lr: 5e-4
        weight_decay: 1e-4
      
      scheduler:
        _target_: functools.partial
        _args_:
          - _target_: hydra.utils.get_class
            path: timm.scheduler.cosine_lr.CosineLRScheduler
        t_initial: ${..epochs}
        lr_min: 1e-6
        warmup_t: 3
        warmup_lr_init: 1e-6
        cycle_mul: 1
        cycle_decay: 1
        cycle_limit: 1

      # Augmentations for training
      augmentations:
        _target_: src.modules.training.augmentation.Augmentation
        kornia:
          _target_: kornia.augmentation.AugmentationSequential
          _args_:
            - _target_: kornia.augmentation.RandomHorizontalFlip
              p: 0.5
            - _target_: kornia.augmentation.RandomVerticalFlip
              p: 0.5
            - _target_: kornia.augmentation.RandomRotation
              degrees: 45
              p: 0.5
            - _target_: kornia.augmentation.ColorJitter
              brightness: 0.2
              contrast: 0.2
              saturation: 0.2
              hue: 0.1
              p: 0.5
            - _target_: kornia.augmentation.RandomGaussianBlur
              kernel_size: [3, 3]
              sigma: [0.1, 2.0]
              p: 0.3
            - _target_: kornia.augmentation.RandomGaussianNoise
              mean: 0.0
              std: 0.05
              p: 0.3
          data_keys:
            - input

      # No augmentations for validation (just normalize)
      val_augmentations:
      
      # Scorer for exact validation metric computation
      scorer:
        _target_: src.scoring.weighted_r2.WeightedR2
        name: weighted_r2

pred_sys:
  steps: []

