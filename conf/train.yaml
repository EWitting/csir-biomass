defaults:
  - base_train
  - hydra/logging
  - model: biomass_sliding_window # Biomass prediction model
  - splitter: season_state
  - wandb: train

###############
#             #
#    PATHS    #
#             #
###############
processed_path: data/processed
raw_path: data/raw
cache_path: data/cache
data_path: data/raw/train.csv

scorer:
  _target_: src.scoring.global_weighted_r2.GlobalWeightedR2
  name: global_weighted_r2  # New global metric
  verbose: true
  log_old_metric: true  # Also log old "weighted_r2" for comparison
  metadata_path: ${data_path}  # Will load metadata from train.csv

use_groups: true  # Whether to use groups for stratified splitting/bagging

allow_multiple_instances: true
